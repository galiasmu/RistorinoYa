# Nombre de la aplicación
spring.application.name=ristorino

# Configuración del servidor (los restaurantes usan 8081-8084)
server.port=8080

# Configuración de la base de datos
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ristorino;encrypt=false
spring.datasource.username=sa
spring.datasource.password=Password.1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

logging.level.org.springframework.transaction=DEBUG

# JWT (Bearer HS256) para el login de clientes, validado como en localidades-rest de la cátedra (32+ caracteres)
security.jwt.secret=ristorino-clave-secreta-para-firmar-tokens-jwt-das-2025
security.jwt.expiracion-minutos=120

# Motor de IA generativa (pendiente de implementar: MotorIARestFacadeImpl)
ia.api.url=
ia.api.key=
ia.api.modelo=
